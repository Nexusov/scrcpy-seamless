# Canonical static options for the current Seamless scrcpy 4.0-derived CLI.
specVersion: 1
upstream:
  repository: "https://github.com/Genymobile/scrcpy"
  tag: "v4.0"
  commit: "9c0c299ea2628d858012f66371eb2fc70988ba07"
options:
  - id: "always-on-top"
    longName: "always-on-top"
    nativeId: "OPT_ALWAYS_ON_TOP"
    nativeNumericId: 1002
    argumentShape: "none"
    nativeHelp: "Make scrcpy window always on top (above other windows)."
    classification: "editable"
    category: "Window"
    valueKind: "boolean"
    label: "Always on top"
  - id: "angle"
    longName: "angle"
    nativeId: "OPT_ANGLE"
    nativeNumericId: 1078
    argumentShape: "required"
    argumentHint: "degrees"
    nativeHelp: "Rotate the video content by a custom angle, in degrees (clockwise)."
    classification: "editable"
    category: "Video"
    valueKind: "decimal"
    label: "Angle"
    pattern: "^-?\\d+(\\.\\d+)?$"
  - id: "audio-bit-rate"
    longName: "audio-bit-rate"
    nativeId: "OPT_AUDIO_BIT_RATE"
    nativeNumericId: 1038
    argumentShape: "required"
    argumentHint: "value"
    nativeHelp: "Encode the audio at the given bit rate, expressed in bits/s. Unit suffixes are supported: \u0027K\u0027 (x1000) and \u0027M\u0027 (x1000000).\nDefault is 128K (128000)."
    classification: "editable"
    category: "Audio"
    valueKind: "bitrate"
    label: "Audio bit rate (for example 128K)"
    pattern: "^\\d+[KMkm]?$"
    defaultValue: "0"
    minimum: 0
  - id: "audio-buffer"
    longName: "audio-buffer"
    nativeId: "OPT_AUDIO_BUFFER"
    nativeNumericId: 1045
    argumentShape: "required"
    argumentHint: "ms"
    nativeHelp: "Configure the audio buffering delay (in milliseconds).\nLower values decrease the latency, but increase the likelihood of buffer underrun (causing audio glitches).\nDefault is 50."
    classification: "editable"
    category: "Audio"
    valueKind: "unsignedInteger"
    label: "Audio buffer (ms)"
    pattern: "^\\d+$"
  - id: "audio-codec"
    longName: "audio-codec"
    nativeId: "OPT_AUDIO_CODEC"
    nativeNumericId: 1039
    argumentShape: "required"
    argumentHint: "name"
    nativeHelp: "Select an audio codec (opus, aac, flac or raw).\nDefault is opus."
    classification: "editable"
    category: "Audio"
    valueKind: "enum"
    label: "Audio codec"
    enumValues:
      - "opus"
      - "aac"
      - "flac"
      - "raw"
    defaultValue: "opus"
  - id: "audio-codec-options"
    longName: "audio-codec-options"
    nativeId: "OPT_AUDIO_CODEC_OPTIONS"
    nativeNumericId: 1040
    argumentShape: "required"
    argumentHint: "key[:type]=value[,...]"
    nativeHelp: "Set a list of comma-separated key:type=value options for the device audio encoder.\nThe possible values for \u0027type\u0027 are \u0027int\u0027 (default), \u0027long\u0027, \u0027float\u0027 and \u0027string\u0027.\nThe list of possible codec options is available in the Android documentation: \u003chttps://d.android.com/reference/android/media/MediaFormat\u003e"
    classification: "editable"
    category: "Audio"
    valueKind: "string"
    label: "Audio codec options"
  - id: "audio-dup"
    longName: "audio-dup"
    nativeId: "OPT_AUDIO_DUP"
    nativeNumericId: 1071
    argumentShape: "none"
    nativeHelp: "Duplicate audio (capture and keep playing on the device).\nThis feature is only available with --audio-source=playback."
    classification: "editable"
    category: "Audio"
    valueKind: "boolean"
    label: "Audio dup"
    ruleIds:
      - "audio-dup-requires-playback"
  - id: "audio-encoder"
    longName: "audio-encoder"
    nativeId: "OPT_AUDIO_ENCODER"
    nativeNumericId: 1041
    argumentShape: "required"
    argumentHint: "name"
    nativeHelp: "Use a specific MediaCodec audio encoder (depending on the codec provided by --audio-codec).\nThe available encoders can be listed by --list-encoders."
    classification: "editable"
    category: "Audio"
    valueKind: "string"
    label: "Audio encoder"
  - id: "audio-source"
    longName: "audio-source"
    nativeId: "OPT_AUDIO_SOURCE"
    nativeNumericId: 1051
    argumentShape: "required"
    argumentHint: "source"
    nativeHelp: "Select the audio source. Possible values are:\n - \"output\": forwards the whole audio output, and disables playback on the device.\n - \"playback\": captures the audio playback (Android apps can opt-out, so the whole output is not necessarily captured).\n - \"mic\": captures the microphone.\n - \"mic-unprocessed\": captures the microphone unprocessed (raw) sound.\n - \"mic-camcorder\": captures the microphone tuned for video recording, with the same orientation as the camera if available.\n - \"mic-voice-recognition\": captures the microphone tuned for voice recognition.\n - \"mic-voice-communication\": captures the microphone tuned for voice communications (it will for instance take advantage of echo cancellation or automatic gain control if available).\n - \"voice-call\": captures voice call.\n - \"voice-call-uplink\": captures voice call uplink only.\n - \"voice-call-downlink\": captures voice call downlink only.\n - \"voice-performance\": captures audio meant to be processed for live performance (karaoke), includes both the microphone and the device playback.\nDefault is output."
    classification: "editable"
    category: "Audio"
    valueKind: "enum"
    label: "Audio source"
    enumValues:
      - "output"
      - "playback"
      - "mic"
      - "mic-unprocessed"
      - "mic-camcorder"
      - "mic-voice-recognition"
      - "mic-voice-communication"
      - "voice-call"
      - "voice-call-uplink"
      - "voice-call-downlink"
      - "voice-performance"
    ruleIds:
      - "audio-dup-requires-playback"
  - id: "audio-output-buffer"
    longName: "audio-output-buffer"
    nativeId: "OPT_AUDIO_OUTPUT_BUFFER"
    nativeNumericId: 1046
    argumentShape: "required"
    argumentHint: "ms"
    nativeHelp: "Configure the size of the SDL audio output buffer (in milliseconds).\nDo not change this setting unless you have a good reason.\nDefault is 10."
    classification: "editable"
    category: "Audio"
    valueKind: "unsignedInteger"
    label: "Audio output buffer (ms)"
    pattern: "^\\d+$"
    defaultValue: "10"
    minimum: 0
  - id: "video-bit-rate"
    longName: "video-bit-rate"
    shortName: "b"
    argumentShape: "required"
    argumentHint: "value"
    nativeHelp: "Encode the video at the given bit rate, expressed in bits/s. Unit suffixes are supported: \u0027K\u0027 (x1000) and \u0027M\u0027 (x1000000).\nDefault is 8M (8000000)."
    classification: "editable"
    category: "Video"
    valueKind: "bitrate"
    label: "Video bit rate (for example 8M)"
    pattern: "^\\d+[KMkm]?$"
    legacyBasic: true
    defaultValue: "0"
    minimum: 0
  - id: "background-color"
    longName: "background-color"
    nativeId: "OPT_BACKGROUND_COLOR"
    nativeNumericId: 1087
    argumentShape: "required"
    argumentHint: "hexcolor"
    nativeHelp: "Set the background color, encoded as hexadecimal color code (#RGB or #RRGGBB).\nDefault is #222 (dark gray)."
    classification: "editable"
    category: "Window"
    valueKind: "color"
    label: "Background color"
    pattern: "^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})$"
  - id: "camera-ar"
    longName: "camera-ar"
    nativeId: "OPT_CAMERA_AR"
    nativeNumericId: 1060
    argumentShape: "required"
    argumentHint: "ar"
    nativeHelp: "Select the camera size by its aspect ratio (+/- 10%).\nPossible values are \"sensor\" (use the camera sensor aspect ratio), \"\u003cnum\u003e:\u003cden\u003e\" (e.g. \"4:3\") or \"\u003cvalue\u003e\" (e.g. \"1.6\")."
    classification: "editable"
    category: "Camera"
    valueKind: "string"
    label: "Camera ar"
    ruleIds:
      - "camera-source-rules"
    conflicts:
      - "camera-size"
  - id: "camera-facing"
    longName: "camera-facing"
    nativeId: "OPT_CAMERA_FACING"
    nativeNumericId: 1059
    argumentShape: "required"
    argumentHint: "facing"
    nativeHelp: "Select the device camera by its facing direction.\nPossible values are \"front\", \"back\" and \"external\"."
    classification: "editable"
    category: "Camera"
    valueKind: "enum"
    label: "Camera facing"
    enumValues:
      - "front"
      - "back"
      - "external"
    ruleIds:
      - "camera-source-rules"
    conflicts:
      - "camera-id"
  - id: "camera-fps"
    longName: "camera-fps"
    nativeId: "OPT_CAMERA_FPS"
    nativeNumericId: 1061
    argumentShape: "required"
    argumentHint: "value"
    nativeHelp: "Specify the camera capture frame rate.\nIf not specified, Android\u0027s default frame rate (30 fps) is used."
    classification: "editable"
    category: "Camera"
    valueKind: "unsignedInteger"
    label: "Camera fps"
    pattern: "^\\d+$"
    ruleIds:
      - "camera-source-rules"
    defaultValue: "0"
    minimum: 0
  - id: "camera-high-speed"
    longName: "camera-high-speed"
    nativeId: "OPT_CAMERA_HIGH_SPEED"
    nativeNumericId: 1062
    argumentShape: "none"
    nativeHelp: "Enable high-speed camera capture mode.\nThis mode is restricted to specific resolutions and frame rates, listed by --list-camera-sizes."
    classification: "editable"
    category: "Camera"
    valueKind: "boolean"
    label: "Camera high speed"
    ruleIds:
      - "camera-source-rules"
  - id: "camera-id"
    longName: "camera-id"
    nativeId: "OPT_CAMERA_ID"
    nativeNumericId: 1057
    argumentShape: "required"
    argumentHint: "id"
    nativeHelp: "Specify the device camera id to mirror.\nThe available camera ids can be listed by:\n    scrcpy --list-cameras"
    classification: "editable"
    category: "Camera"
    valueKind: "string"
    label: "Camera id"
    ruleIds:
      - "camera-source-rules"
    conflicts:
      - "camera-facing"
  - id: "camera-size"
    longName: "camera-size"
    nativeId: "OPT_CAMERA_SIZE"
    nativeNumericId: 1058
    argumentShape: "required"
    argumentHint: "\u003cwidth\u003ex\u003cheight\u003e"
    nativeHelp: "Specify an explicit camera capture size."
    classification: "editable"
    category: "Camera"
    valueKind: "size"
    label: "Camera size"
    pattern: "^\\d+x\\d+$"
    ruleIds:
      - "camera-source-rules"
    conflicts:
      - "camera-ar"
  - id: "camera-torch"
    longName: "camera-torch"
    nativeId: "OPT_CAMERA_TORCH"
    nativeNumericId: 1082
    argumentShape: "none"
    nativeHelp: "Turn on the camera torch when the camera starts."
    classification: "editable"
    category: "Camera"
    valueKind: "boolean"
    label: "Camera torch"
  - id: "camera-zoom"
    longName: "camera-zoom"
    nativeId: "OPT_CAMERA_ZOOM"
    nativeNumericId: 1083
    argumentShape: "required"
    argumentHint: "zoom"
    nativeHelp: "Specify the camera zoom initial value."
    classification: "editable"
    category: "Camera"
    valueKind: "decimal"
    label: "Camera zoom"
    pattern: "^\\d+(\\.\\d+)?$"
  - id: "capture-orientation"
    longName: "capture-orientation"
    nativeId: "OPT_CAPTURE_ORIENTATION"
    nativeNumericId: 1077
    argumentShape: "required"
    argumentHint: "value"
    nativeHelp: "Set the capture video orientation.\nPossible values are 0, 90, 180, 270, flip0, flip90, flip180 and flip270, possibly prefixed by \u0027@\u0027.\nThe number represents the clockwise rotation in degrees; the flip\" keyword applies a horizontal flip before the rotation.\nIf a leading \u0027@\u0027 is passed (@90) for display capture, then the rotation is locked, and is relative to the natural device orientation.\nIf \u0027@\u0027 is passed alone, then the rotation is locked to the initial device orientation.\nDefault is 0."
    classification: "editable"
    category: "Video"
    valueKind: "string"
    label: "Capture orientation"
  - id: "crop"
    longName: "crop"
    nativeId: "OPT_CROP"
    nativeNumericId: 1003
    argumentShape: "required"
    argumentHint: "width:height:x:y"
    nativeHelp: "Crop the device screen on the server.\nThe values are expressed in the device natural orientation (typically, portrait for a phone, landscape for a tablet)."
    classification: "editable"
    category: "Video"
    valueKind: "string"
    label: "Crop"
  - id: "select-usb"
    longName: "select-usb"
    shortName: "d"
    argumentShape: "none"
    nativeHelp: "Use USB device (if there is exactly one, like adb -d).\nAlso see -e (--select-tcpip)."
    classification: "managed"
    category: "Technical"
    valueKind: "boolean"
    label: "Select usb"
    legacyReason: "Selected by the launcher connection settings."
  - id: "disable-screensaver"
    longName: "disable-screensaver"
    nativeId: "OPT_DISABLE_SCREENSAVER"
    nativeNumericId: 1017
    argumentShape: "none"
    nativeHelp: "Disable screensaver while scrcpy is running."
    classification: "editable"
    category: "Window"
    valueKind: "boolean"
    label: "Disable screensaver"
  - id: "display-id"
    longName: "display-id"
    nativeId: "OPT_DISPLAY_ID"
    nativeNumericId: 1012
    argumentShape: "required"
    argumentHint: "id"
    nativeHelp: "Specify the device display id to mirror.\nThe available display ids can be listed by:\n    scrcpy --list-displays\nDefault is 0."
    classification: "editable"
    category: "Device"
    valueKind: "unsignedInteger"
    label: "Display id"
    pattern: "^\\d+$"
    ruleIds:
      - "virtual-display-rules"
    defaultValue: "0"
    minimum: 0
  - id: "display-ime-policy"
    longName: "display-ime-policy"
    nativeId: "OPT_DISPLAY_IME_POLICY"
    nativeNumericId: 1081
    argumentShape: "required"
    argumentHint: "value"
    nativeHelp: "Set the policy for selecting where the IME should be displayed.\nPossible values are \"local\", \"fallback\" and \"hide\".\n\"local\" means that the IME should appear on the local display.\n\"fallback\" means that the IME should appear on a fallback display (the default display).\n\"hide\" means that the IME should be hidden."
    classification: "editable"
    category: "Device"
    valueKind: "enum"
    label: "Display ime policy"
    enumValues:
      - "local"
      - "fallback"
      - "hide"
  - id: "display-orientation"
    longName: "display-orientation"
    nativeId: "OPT_DISPLAY_ORIENTATION"
    nativeNumericId: 1063
    argumentShape: "required"
    argumentHint: "value"
    nativeHelp: "Set the initial display orientation.\nPossible values are 0, 90, 180, 270, flip0, flip90, flip180 and flip270. The number represents the clockwise rotation in degrees; the \"flip\" keyword applies a horizontal flip before the rotation.\nDefault is 0."
    classification: "editable"
    category: "Video"
    valueKind: "enum"
    label: "Display orientation"
    enumValues:
      - "0"
      - "90"
      - "180"
      - "270"
      - "flip0"
      - "flip90"
      - "flip180"
      - "flip270"
  - id: "select-tcpip"
    longName: "select-tcpip"
    shortName: "e"
    argumentShape: "none"
    nativeHelp: "Use TCP/IP device (if there is exactly one, like adb -e).\nAlso see -d (--select-usb)."
    classification: "managed"
    category: "Technical"
    valueKind: "boolean"
    label: "Select tcpip"
    legacyReason: "Selected by the launcher connection settings."
  - id: "fullscreen"
    longName: "fullscreen"
    shortName: "f"
    argumentShape: "none"
    nativeHelp: "Start in fullscreen."
    classification: "editable"
    category: "Window"
    valueKind: "boolean"
    label: "Fullscreen"
  - id: "force-adb-forward"
    longName: "force-adb-forward"
    nativeId: "OPT_FORCE_ADB_FORWARD"
    nativeNumericId: 1016
    argumentShape: "none"
    nativeHelp: "Do not attempt to use \"adb reverse\" to connect to the device."
    classification: "editable"
    category: "Technical"
    valueKind: "boolean"
    label: "Force adb forward"
  - id: "gamepad-uhid-shortcut"
    shortName: "G"
    argumentShape: "none"
    nativeHelp: "Same as --gamepad=uhid, or --gamepad=aoa if --otg is set."
    classification: "alias"
    aliasFor: "gamepad"
    category: "Input \u0026 Control"
    valueKind: "boolean"
    label: "Same as --gamepad=uhid, or --gamepad=aoa if --otg is set."
    description: "Same as --gamepad=uhid, or --gamepad=aoa if --otg is set."
  - id: "gamepad"
    longName: "gamepad"
    nativeId: "OPT_GAMEPAD"
    nativeNumericId: 1072
    argumentShape: "required"
    argumentHint: "mode"
    nativeHelp: "Select how to send gamepad inputs to the device.\nPossible values are \"disabled\", \"uhid\" and \"aoa\".\n\"disabled\" does not send gamepad inputs to the device.\n\"uhid\" simulates physical HID gamepads using the Linux UHID kernel module on the device.\n\"aoa\" simulates physical gamepads using the AOAv2 protocol.It may only work over USB.\nAlso see --keyboard and --mouse."
    classification: "editable"
    category: "Control"
    valueKind: "enum"
    label: "Gamepad"
    enumValues:
      - "disabled"
      - "uhid"
      - "aoa"
    legacyReason: "AOA input is unavailable in this portable native build. SDK and UHID availability depends on the device and selected input."
  - id: "help"
    longName: "help"
    shortName: "h"
    argumentShape: "none"
    nativeHelp: "Print this help."
    classification: "action"
    category: "Technical"
    valueKind: "boolean"
    label: "Help"
    legacyReason: "Prints information and exits; this is a diagnostic action, not a saved streaming setting."
  - id: "keyboard-uhid-shortcut"
    shortName: "K"
    argumentShape: "none"
    nativeHelp: "Same as --keyboard=uhid, or --keyboard=aoa if --otg is set."
    classification: "alias"
    aliasFor: "keyboard"
    category: "Input \u0026 Control"
    valueKind: "boolean"
    label: "Same as --keyboard=uhid, or --keyboard=aoa if --otg is set."
    description: "Same as --keyboard=uhid, or --keyboard=aoa if --otg is set."
  - id: "keep-active"
    longName: "keep-active"
    nativeId: "OPT_KEEP_ACTIVE"
    nativeNumericId: 1086
    argumentShape: "none"
    nativeHelp: "Keep the screen on by simulating user activity."
    classification: "editable"
    category: "Device"
    valueKind: "boolean"
    label: "Keep active"
  - id: "keyboard"
    longName: "keyboard"
    nativeId: "OPT_KEYBOARD"
    nativeNumericId: 1066
    argumentShape: "required"
    argumentHint: "mode"
    nativeHelp: "Select how to send keyboard inputs to the device.\nPossible values are \"disabled\", \"sdk\", \"uhid\" and \"aoa\".\n\"disabled\" does not send keyboard inputs to the device.\n\"sdk\" uses the Android system API to deliver keyboard events to applications.\n\"uhid\" simulates a physical HID keyboard using the Linux UHID kernel module on the device.\n\"aoa\" simulates a physical keyboard using the AOAv2 protocol. It may only work over USB.\nFor \"uhid\" and \"aoa\", the keyboard layout must be configured (once and for all) on the device, via Settings -\u003e System -\u003e Languages and input -\u003e Physical keyboard. This settings page can be started directly using the shortcut MOD+k (except in OTG mode) or by executing: `adb shell am start -a android.settings.HARD_KEYBOARD_SETTINGS`.\nThis option is only available when a HID keyboard is enabled (or a physical keyboard is connected).\nAlso see --mouse and --gamepad."
    classification: "editable"
    category: "Control"
    valueKind: "enum"
    label: "Keyboard"
    enumValues:
      - "disabled"
      - "sdk"
      - "uhid"
      - "aoa"
    legacyReason: "AOA input is unavailable in this portable native build. SDK and UHID availability depends on the device and selected input."
  - id: "kill-adb-on-close"
    longName: "kill-adb-on-close"
    nativeId: "OPT_KILL_ADB_ON_CLOSE"
    nativeNumericId: 1052
    argumentShape: "none"
    nativeHelp: "Kill adb when scrcpy terminates."
    classification: "managed"
    category: "Technical"
    valueKind: "boolean"
    label: "Kill adb on close"
    legacyReason: "ADB is shared with other programs; the launcher manages its lifecycle."
  - id: "legacy-paste"
    longName: "legacy-paste"
    nativeId: "OPT_LEGACY_PASTE"
    nativeNumericId: 1020
    argumentShape: "none"
    nativeHelp: "Inject computer clipboard text as a sequence of key events on Ctrl+v (like MOD+Shift+v).\nThis is a workaround for some devices not behaving as expected when setting the device clipboard programmatically."
    classification: "editable"
    category: "Control"
    valueKind: "boolean"
    label: "Legacy paste"
  - id: "list-apps"
    longName: "list-apps"
    nativeId: "OPT_LIST_APPS"
    nativeNumericId: 1074
    argumentShape: "none"
    nativeHelp: "List Android apps installed on the device."
    classification: "action"
    category: "Technical"
    valueKind: "boolean"
    label: "List apps"
    legacyReason: "Prints information and exits; this is a diagnostic action, not a saved streaming setting."
  - id: "list-cameras"
    longName: "list-cameras"
    nativeId: "OPT_LIST_CAMERAS"
    nativeNumericId: 1055
    argumentShape: "none"
    nativeHelp: "List device cameras."
    classification: "action"
    category: "Technical"
    valueKind: "boolean"
    label: "List cameras"
    legacyReason: "Prints information and exits; this is a diagnostic action, not a saved streaming setting."
  - id: "list-camera-sizes"
    longName: "list-camera-sizes"
    nativeId: "OPT_LIST_CAMERA_SIZES"
    nativeNumericId: 1056
    argumentShape: "none"
    nativeHelp: "List the valid camera capture sizes."
    classification: "action"
    category: "Technical"
    valueKind: "boolean"
    label: "List camera sizes"
    legacyReason: "Prints information and exits; this is a diagnostic action, not a saved streaming setting."
  - id: "list-displays"
    longName: "list-displays"
    nativeId: "OPT_LIST_DISPLAYS"
    nativeNumericId: 1043
    argumentShape: "none"
    nativeHelp: "List device displays."
    classification: "action"
    category: "Technical"
    valueKind: "boolean"
    label: "List displays"
    legacyReason: "Prints information and exits; this is a diagnostic action, not a saved streaming setting."
  - id: "list-encoders"
    longName: "list-encoders"
    nativeId: "OPT_LIST_ENCODERS"
    nativeNumericId: 1042
    argumentShape: "none"
    nativeHelp: "List video and audio encoders available on the device."
    classification: "action"
    category: "Technical"
    valueKind: "boolean"
    label: "List encoders"
    legacyReason: "Prints information and exits; this is a diagnostic action, not a saved streaming setting."
  - id: "max-size"
    longName: "max-size"
    shortName: "m"
    argumentShape: "required"
    argumentHint: "value"
    nativeHelp: "Limit both the width and height of the video.\nFor display mirroring, the other dimension is computed so that the device aspect ratio is preserved (except for flex displays).\nFor camera mirroring, the value is used to select the camera source size instead.\nDefault is 0 (unlimited)."
    classification: "editable"
    category: "Video"
    valueKind: "unsignedInteger"
    label: "Maximum resolution (longest edge, pixels)"
    pattern: "^\\d+$"
    legacyBasic: true
    defaultValue: "0"
    minimum: 0
  - id: "mouse-uhid-shortcut"
    shortName: "M"
    argumentShape: "none"
    nativeHelp: "Same as --mouse=uhid, or --mouse=aoa if --otg is set."
    classification: "alias"
    aliasFor: "mouse"
    category: "Input \u0026 Control"
    valueKind: "boolean"
    label: "Same as --mouse=uhid, or --mouse=aoa if --otg is set."
    description: "Same as --mouse=uhid, or --mouse=aoa if --otg is set."
  - id: "max-fps"
    longName: "max-fps"
    nativeId: "OPT_MAX_FPS"
    nativeNumericId: 1011
    argumentShape: "required"
    argumentHint: "value"
    nativeHelp: "Limit the frame rate of screen capture (officially supported since Android 10, but may work on earlier versions)."
    classification: "editable"
    category: "Video"
    valueKind: "string"
    label: "Maximum frame rate (FPS)"
    description: "Limit the frame rate of screen capture (officially supported since Android 10, but may work on earlier versions). This is an upper limit, not a guaranteed frame rate, and does not increase the frame rate of the source video."
    pattern: "^\\d+(\\.\\d+)?$"
    legacyBasic: true
  - id: "min-size-alignment"
    longName: "min-size-alignment"
    nativeId: "OPT_MIN_SIZE_ALIGNMENT"
    nativeNumericId: 1084
